name: Website
on:
  push:
    branches: [main]
    paths: ["docs/**", "mobile/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_run:            # re-publish the site after each Android build, so the APK mirror is fresh
    workflows: ["Android app"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (project page + phone app at /app)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp -r mobile _site/app
          # Mirror the latest APK on the website (GitHub Pages CDN is usually much faster than release downloads).
          gh release download android-latest -R "${{ github.repository }}" -p DocMind.apk -D _site || echo "no APK yet"
          ls -la _site/DocMind.apk || true
        env: { GH_TOKEN: "${{ github.token }}" }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
