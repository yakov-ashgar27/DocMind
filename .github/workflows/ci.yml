name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages (OCR, PDF, HEIC)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb poppler-utils imagemagick libheif1 fonts-dejavu-core
      - name: Python packages
        run: pip install -r backend/requirements-dev.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
